services:
  mam-audiofinder:
    # `up --build` uses the checked-out source; `pull` can use the published GHCR image.
    build: .
    container_name: mam-audiofinder
    ports:
      - "8080:8080"
    environment:
      MAM_COOKIE: ""
      TRANSMISSION_URL: "http://transmission:9091/transmission/rpc"
      TRANSMISSION_USER: ""
      TRANSMISSION_PASS: ""
    volumes:
      - /path/to/appdata-for-db:/data
      # Use one shared media root so /downloads, /library, and /ebooks can hardlink.
      # Expected subdirectories: downloads, audiobooks, ebooks.
      - /path/to/media-root:/storage
    restart: unless-stopped
